name: AstroTool

options:
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  AstroToolPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_STYLE: Automatic

targets:
  AstroTool:
    type: application
    platform: macOS
    sources:
      - path: Sources/AstroToolApp
    dependencies:
      - package: AstroToolPackage
        product: AstroCore
      - package: AstroToolPackage
        product: AstroApplication
      - package: AstroToolPackage
        product: AstroUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrotool.app
        PRODUCT_NAME: AstroTool
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AstroTool
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography

  AstroToolUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/AstroToolUITests
    dependencies:
      - target: AstroTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrotool.app.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AstroTool

  AstroToolMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/AstroToolMobile
    dependencies:
      - package: AstroToolPackage
        product: AstroMobileDomain
      - package: AstroToolPackage
        product: AstroMobileTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrotool.mobile
        PRODUCT_NAME: AstroToolMobile
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AstroTool
    info:
      path: Sources/AstroToolMobile/Info.plist
      properties:
        NSCameraUsageDescription: "AstroTool uses the camera to scan the one-time key for a mobile package from your Mac."
        CFBundleDocumentTypes:
          - CFBundleTypeName: AstroTool Mobile Package
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - io.github.themokx1.astrotool.mobile-snapshot
        LSSupportsOpeningDocumentsInPlace: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.themokx1.astrotool.mobile-snapshot
            UTTypeDescription: AstroTool Mobile Package
            UTTypeConformsTo:
              - com.apple.package
              - public.content
            UTTypeTagSpecification:
              public.filename-extension: astromobile
              public.mime-type: application/x-astrotool-mobile

  AstroToolMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AstroToolMobileTests
    dependencies:
      - target: AstroToolMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrotool.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AstroToolMobile.app/AstroToolMobile"
        BUNDLE_LOADER: "$(TEST_HOST)"

  AstroToolMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/AstroToolMobileUITests
    dependencies:
      - target: AstroToolMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrotool.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AstroToolMobile

schemes:
  AstroTool:
    build:
      targets:
        AstroTool: all
        AstroToolUITests: [test]
    test:
      targets:
        - AstroToolUITests
  AstroToolMobile:
    build:
      targets:
        AstroToolMobile: all
        AstroToolMobileTests: [test]
        AstroToolMobileUITests: [test]
    test:
      targets:
        - AstroToolMobileTests
        - AstroToolMobileUITests
