name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --no-parallel
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Enlarge the runner's virtual display
        # The hosted macOS runner boots a 1024x768 virtual display; the app's
        # main window declares minWidth 1100 / minHeight 700 and the Planning
        # page needs ~836pt of height, so at 1024x768 the window gets clamped
        # to 900x652 and content overflows the title bar (sidebar rows become
        # non-hittable). Verified from an AX snapshot of run 2026-08-19.
        run: |
          brew install --quiet jakehilborn/jakehilborn/displayplacer || brew install --quiet displayplacer || true
          if command -v displayplacer >/dev/null; then
            main_id="$(displayplacer list | sed -n 's/^Persistent screen id: //p' | head -1)"
            displayplacer "id:$main_id res:1920x1080" || echo "WARN: display resize failed"
          else
            echo "WARN: displayplacer unavailable"
          fi
          system_profiler SPDisplaysDataType | grep -i resolution || true

      - name: V2 UI smoke
        run: >-
          xcodebuild test
          -project AstroTool.xcodeproj
          -scheme AstroTool
          -destination 'platform=macOS'
          -only-testing:AstroToolUITests/AstroToolLaunchTests
      - name: Check public content
        run: |
          scripts/check-public-content.sh
          scripts/check-release-metadata.sh
      - name: Build Universal release artifacts
        run: ./build.sh
      - name: Smoke-test a clean installation
        run: scripts/smoke-clean-install.sh
      - name: Verify architectures and signature
        run: |
          lipo -archs build/AstroTool.app/Contents/MacOS/AstroTool
          lipo -archs build/AstroTool.app/Contents/Resources/astrotool
          codesign --verify --deep --strict build/AstroTool.app
      - uses: actions/upload-artifact@v4
        with:
          name: AstroTool-unsigned-test-build
          path: |
            build/AstroTool-*.dmg
            build/astrotool-*.zip
            build/SHA256SUMS.txt
