name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --no-parallel
      - name: Check public content
        run: |
          scripts/check-public-content.sh
          scripts/check-release-metadata.sh
      - name: Build Universal release artifacts
        run: ./build.sh
      - name: Smoke-test a clean installation
        run: scripts/smoke-clean-install.sh
      - name: Verify architectures and signature
        run: |
          lipo -archs build/AstroTool.app/Contents/MacOS/AstroTool
          lipo -archs build/AstroTool.app/Contents/Resources/astrotool
          codesign --verify --deep --strict build/AstroTool.app
      - uses: actions/upload-artifact@v4
        with:
          name: AstroTool-unsigned-test-build
          path: |
            build/AstroTool-*.dmg
            build/astrotool-*.zip
            build/SHA256SUMS.txt
