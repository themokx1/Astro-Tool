name: Update v0.13.2 release notes

on:
  push:
    branches: [main]
    paths:
      - docs/releases/v0.13.2.md

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update v0.13.2 release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.13.2 --notes-file docs/releases/v0.13.2.md
